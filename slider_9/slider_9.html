<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Sci-Fi Card System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --cyan: #00f2ff;
            --dark-bg: #07080f;
            --card-grad: linear-gradient(180deg, #1a113a 0%, #0a0714 100%);
            --clip-path: polygon(15% 0%, 100% 0%, 100% 85%, 85% 100%, 0% 100%, 0% 15%);
        }

        body {
            background-color: var(--dark-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .ui-wrapper {
            display: flex;
            align-items: center;
            width: 90%;
            gap: 60px;
        }

        /* --- SIDE MENU --- */
        .side-menu { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            width: 80px;
            z-index: 9;
            min-height: 300px;
            justify-content: center;
        }

        .side-item {
            width: 75px; height: 75px;
            background: rgba(0, 242, 255, 0.1);
            clip-path: var(--clip-path);
            cursor: pointer;
            box-shadow: 0 0 10px var(--cyan);
            display: none; 
            align-items: center; justify-content: center;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }

        .side-item.visible { display: flex; opacity: 0.4; transform: scale(0.85); }
        .side-item.active { 
            display: flex; opacity: 1; transform: scale(1.1); 
            background: rgba(0, 242, 255, 0.3);
            outline: 2px solid var(--cyan);
            box-shadow: 0 0 15px var(--cyan);
        }

        .side-item img { width: 95%; filter: grayscale(1); transition: 0.3s; }
        .side-item.active img { filter: grayscale(0); }

        /* --- MAIN SLIDER --- */
        .slider-container { flex-grow: 1; }
        .swiper { padding: 100px 0; overflow: visible !important; }
        .swiper-slide { width: 280px; height: 380px; transition: 0.5s; filter: brightness(0.3); }
        .swiper-slide-active { filter: brightness(1); }

        .card-wrapper {
            position: relative;
            width: 100%; height: 100%;
            display: flex; align-items: flex-end;
            transition: 0.3s ease;
        }

        /* --- ANIMATED BORDER --- */
        .card-border-trail {
            position: absolute; bottom: 0; width: 100%; height: 85%;
            background: #111; clip-path: var(--clip-path);
            z-index: 1; display: flex; align-items: center;
            justify-content: center; overflow: hidden;
        }

        .swiper-slide-active .card-border-trail::before {
            content: ''; position: absolute; width: 250%; height: 250%;
            background: conic-gradient(transparent, var(--cyan), transparent 30%);
            animation: rotateBorder 4s linear infinite;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-bg {
            position: absolute; inset: 2px;
            background: var(--card-grad); clip-path: var(--clip-path);
            z-index: 2;
        }

        /* --- HOVER & TIPS --- */
        .swiper-slide-active:hover .card-wrapper {
            transform: translateY(-15px);
            filter: drop-shadow(0 0 25px rgba(0, 242, 255, 0.7));
        }

        .swiper-slide-active .card-wrapper::before,
        .swiper-slide-active .card-wrapper::after {
            content: ''; position: absolute; width: 35px; height: 35px;
            z-index: 10; filter: drop-shadow(0 0 5px var(--cyan));
        }
        .swiper-slide-active .card-wrapper::before {
            top: 12%; left: -10px; border-top: 3px solid var(--cyan); border-left: 3px solid var(--cyan);
        }
        .swiper-slide-active .card-wrapper::after {
            bottom: -10px; right: -10px; border-bottom: 3px solid var(--cyan); border-right: 3px solid var(--cyan);
        }

        .char-img {
            position: absolute; bottom: 10px; left: 50%; height: 80%; transform: translateX(-50%); width: 95%; clip-path: var(--clip-path); z-index: 5;
            transition: 0.4s ease; pointer-events: none;
        }

        .swiper{
            padding: 100px 0;
        }
        .swiper-3d {
    margin-left: -1200px;
}
.swiper-wrapper {
    width: 10%;
}
        .swiper-horizontal>.swiper-pagination-bullets, .swiper-pagination-bullets.swiper-pagination-horizontal, .swiper-pagination-custom, .swiper-pagination-fraction {
    left: 100px;
        }
        .swiper-pagination-bullet-active { background: var(--cyan) !important; box-shadow: 0 0 10px var(--cyan); }

        .swiper-horizontal>.swiper-pagination-bullets .swiper-pagination-bullet, .swiper-pagination-horizontal.swiper-pagination-bullets .swiper-pagination-bullet {
    margin: 0 var(--swiper-pagination-bullet-horizontal-gap, 4px);
    border: 3px solid red;
    margin: 5px;
    box-shadow: 2px 2px 10px var(--cyan);
}
    </style>
</head>
<body>

    <h1 style="position: absolute; color: #00f2ff;  text-shadow: 2px 2px 10px var(--cyan);top: 70px;">SLIDER</h1>
<div class="ui-wrapper">
    <div class="side-menu" id="sideMenu"></div>

    <div class="slider-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="mainWrapper"></div>
            <div class="swiper-pagination"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const characters = [
        { id: 1, img: "./images/images (1).jpg" },
        { id: 2, img: "./images/images (2).jpg" },
        { id: 3, img: "./images/images (3).jpg" },
        { id: 4, img: "./images/images (4).jpg" },
        { id: 5, img: "./images/images (5).jpg" },
        { id: 6, img: "./images/images (6).jpg" },
        { id: 7, img: "./images/images (7).jpg" },
        { id: 8, img: "./images/images (8).jpg" },
        { id: 9, img: "./images/images (9).jpg" },
        { id: 10, img: "./images/images (10).jpg" },
        { id: 11, img: "./images/images (11).jpg" },
        { id: 12, img: "./images/images.jpg" }
];

    const sideMenu = document.getElementById('sideMenu');
    const mainWrapper = document.getElementById('mainWrapper');

    // 2. DYNAMIC GENERATION
    characters.forEach((char, index) => {
        // Build Side Menu
        const sideItem = document.createElement('div');
        sideItem.className = 'side-item';
        sideItem.onclick = () => swiper.slideTo(index);
        sideItem.innerHTML = `<img src="${char.img}">`;
        sideMenu.appendChild(sideItem);

        // Build Main Slider
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `
            <div class="card-wrapper">
                <div class="card-border-trail">
                    <div class="card-bg"></div>
                </div>
                <img src="${char.img}" class="char-img">
            </div>
        `;
        mainWrapper.appendChild(slide);
    });

    const sideElements = document.querySelectorAll('.side-item');

    // 3. FOCUS LOGIC (The "3-Card View")
    const updateSideMenu = (index) => {
        sideElements.forEach((item, i) => {
            item.classList.remove('active', 'visible');
            if (i === index) {
                item.classList.add('active', 'visible');
            } else if (i === index - 1 || i === index + 1) {
                item.classList.add('visible');
            }
        });
    };

    // 4. SWIPER INITIALIZATION
    const swiper = new Swiper(".mySwiper", {
        effect: "coverflow",
        centeredSlides: true,
        slidesPerView: "auto",
        coverflowEffect: {
            rotate: 0,
            stretch: 80,
            depth: 200,
            modifier: 1,
            slideShadows: false,
        },
        pagination: { el: ".swiper-pagination", clickable: true },
        on: {
            init: function() { updateSideMenu(this.activeIndex); },
            slideChange: function() { updateSideMenu(this.activeIndex); }
        }
    });
</script>
</body>
</html>
