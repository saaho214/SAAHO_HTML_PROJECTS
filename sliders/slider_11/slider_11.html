<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festive Z-Shard UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --gold: #ffcf40;
            --crimson: #8b0000;
            --dark-festive: #1a0505;
            /* The Z-Shard Clip: Creates two panels with a gap in the middle */
            --z-shard-clip: polygon(0% 0%, 100% 0%, 100% 20%, 30% 20%, 70% 80%, 0% 80%, 0% 100%, 100% 100%, 100% 80%, 70% 80%, 30% 20%, 0% 20%);
        }

        body {
            background-color: var(--dark-festive);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', serif;
        }

        .ui-wrapper {
            display: flex;
            align-items: center;
            width: 95%;
            max-width: 1200px;
            gap: 50px;
        }

        /* --- SIDE MENU: LANTERN STYLE --- */
        .side-menu { display: flex; flex-direction: column; gap: 25px; width: 80px; z-index: 9; }

        .side-item {
            width: 60px; height: 80px;
            background: rgba(255, 207, 64, 0.1);
            clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0% 75%, 0% 25%);
            cursor: pointer;
            display: none;
            align-items: center; justify-content: center;
            transition: 0.4s ease;
        }

        .side-item.visible { display: flex; opacity: 0.3; transform: scale(0.8); }
        .side-item.active { 
            display: flex; opacity: 1; transform: scale(1.1); 
            background: var(--gold);
            box-shadow: 0 0 20px var(--gold);
        }

        .side-item img { width: 60%; filter: drop-shadow(0 0 2px black); }

        /* --- MAIN SLIDER --- */
        .slider-container { flex-grow: 1; }
        .swiper { padding: 100px 0; overflow: visible !important; margin-left: -400px; }
        .swiper-slide { width: 300px; height: 400px; transition: 0.6s; filter: brightness(0.3); }
        .swiper-slide-active { filter: brightness(1); }

        .card-wrapper {
            position: relative;
            width: 100%; height: 100%;
            display: flex; align-items: flex-end;
        }

        /* The "Z" Split Background Panels */
        .card-bg {
            position: absolute;
            width: 100%; height: 85%;
            background: linear-gradient(135deg, var(--crimson), #4a0000);
            clip-path: var(--z-shard-clip);
            z-index: 1;
            border: 1px solid rgba(255, 207, 64, 0.2);
        }

        /* The Energy Leak (The thread that moves through the gap) */
        .swiper-slide-active .energy-leak {
            position: absolute;
            top: 20%; left: 0;
            width: 100%; height: 60%;
            z-index: 0; /* Sits behind the gap */
            overflow: hidden;
        }

        .swiper-slide-active .energy-leak::after {
            content: '';
            position: absolute;
            width: 150%; height: 2px;
            background: var(--gold);
            box-shadow: 0 0 15px 2px var(--gold);
            top: 50%; left: -150%;
            transform: rotate(35deg);
            animation: flow 2.5s infinite linear;
        }

        @keyframes flow {
            0% { left: -150%; top: 0%; }
            100% { left: 150%; top: 100%; }
        }

        /* Character Pop-out */
        .char-img {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            width: 85%;
            z-index: -3;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.8));
        }

        .swiper-slide-active:hover .char-img {
            transform: translateX(-50%) translateY(-20px) scale(1.05);
        }

        /* Festive Name Label */
        .char-label {
            position: absolute;
            top: -10px; right: -10px;
            background: var(--gold);
            color: black;
            padding: 5px 15px;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            z-index: 10;
            opacity: 0;
            transition: 0.4s;
        }

        .swiper-slide-active .char-label { opacity: 1; top: 5px; }

    </style>
</head>
<body>
<h1 style="position: absolute; letter-spacing: 50%; text-align: justify; box-shadow: 0 0 15px 2px var(--gold); top: 40px; color: #c89600d7;">SLIDER</h1>
<div class="ui-wrapper">
    <div class="side-menu" id="sideMenu"></div>

    <div class="slider-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="mainWrapper"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const items = [
        { name: "2 rs coin", img: "./images/images (1).png" },
        { name: "10 rs coin", img: "./images/images (4).png" },
        { name: "5 rs coin", img: "./images/images (3).png" },
        { name: "1 rs coin", img: "./images/images (2).png" },
        { name: "20 rs coin", img: "./images/images.png" },
        { name: "100 rs coin", img: "./images/images (5).png" }
    ];

    const sideMenu = document.getElementById('sideMenu');
    const mainWrapper = document.getElementById('mainWrapper');

    items.forEach((item, index) => {
        // Side Item
        const side = document.createElement('div');
        side.className = 'side-item';
        side.onclick = () => swiper.slideTo(index);
        side.innerHTML = `<img src="${item.img}">`;
        sideMenu.appendChild(side);

        // Slide
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `
            <div class="card-wrapper">
                <div class="char-label">${item.name}</div>
                <div class="energy-leak"></div>
                <div class="card-bg"></div>
                <img src="${item.img}" class="char-img">
            </div>
        `;
        mainWrapper.appendChild(slide);
    });

    const sideElems = document.querySelectorAll('.side-item');

    const updateUI = (index) => {
        sideElems.forEach((el, i) => {
            el.classList.remove('active', 'visible');
            if (i === index) el.classList.add('active', 'visible');
            else if (i === index - 1 || i === index + 1) el.classList.add('visible');
        });
    };

    const swiper = new Swiper(".mySwiper", {
        effect: "coverflow",
        centeredSlides: true,
        slidesPerView: "auto",
        coverflowEffect: {
            rotate: 0,
            stretch: 60,
            depth: 200,
            modifier: 1.5,
            slideShadows: false,
        },
        on: {
            init: function() { updateUI(this.activeIndex); },
            slideChange: function() { updateUI(this.activeIndex); }
        }
    });
</script>
</body>
</html>
