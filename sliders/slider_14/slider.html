<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Bio-Hex UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --star-gold: #ffcc00;
            --nebula-violet: #6a0dad;
            --deep-space: #0f172f;
            
            --hex-clip: polygon(50% 0%, 100% 20%, 100% 45%, 90% 50%, 100% 55%, 100% 80%, 50% 100%, 0% 80%, 0% 55%, 10% 50%, 0% 45%, 0% 20%);
        }

        body {
            background-color: var(--deep-space);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        .ui-wrapper {
            display: flex;
            align-items: center;
            width: 90%;
            gap: 40px;
        }

        /* --- SIDE MENU: CONSTELLATION NODES --- */
        .side-menu { display: flex; flex-direction: column; gap: 15px; width: 80px; z-index: 5; }

        .side-item {
            width: 55px; height: 75px;
            background: rgba(255, 204, 0, 0.1);
            clip-path: var(--hex-clip);
            cursor: pointer;
            display: none;
            align-items: center; justify-content: center;
            transition: 0.4s ease-in-out;
            border: 1px solid rgba(255, 204, 0, 0.2);
        }

        .side-item.visible { display: flex; opacity: 0.3; transform: scale(0.8); }
        .side-item.active { 
            display: flex; opacity: 1; transform: scale(1.1); 
            background: rgba(255, 204, 0, 0.3);
            border: 1px solid var(--star-gold);
            box-shadow: 0 0 15px var(--star-gold);
        }

        .side-item img { width: 70%; filter: drop-shadow(0 0 5px var(--star-gold)); }

        /* --- MAIN SLIDER --- */
        .slider-container { flex-grow: 1; }
        .swiper { padding: 100px 0; overflow: visible !important; margin-left: -400px;}
        .swiper-slide { width: 320px; height: 440px; transition: 0.6s; filter: opacity(0.2) scale(0.8); }
        .swiper-slide-active { filter: opacity(1) scale(1); }

        .card-wrapper {
            position: relative;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        /* The Celestial Hex Frame */
        .card-main {
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, #0a0e1a 0%, #1a0a2e 100%);
            clip-path: var(--hex-clip);
            z-index: 1;
            border: 1px solid rgba(255, 204, 0, 0.2);
        }

        /* The Orbital Portal */
        .portal {
            position: absolute;
            width: 240px; height: 240px;
            background: radial-gradient(circle, rgba(106, 13, 173, 0.3) 0%, transparent 70%);
            border: 2px dashed var(--star-gold);
            border-radius: 50%;
            z-index: 2;
            animation: rotatePortal 20s linear infinite;
        }

        .portal::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: radial-gradient(circle at center, transparent 60%, var(--star-gold) 100%);
            opacity: 0.3;
            filter: blur(8px);
        }

        @keyframes rotatePortal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Floating Planet/Character */
        .char-img {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 240px; height: 240px;
            border-radius: 50%;
            z-index: 5;
            transition: 0.5s ease-out;
            filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.4));
        }

        .swiper-slide-active:hover .char-img {
            transform: translateX(-50%) translateY(-20px) scale(1.1);
            filter: drop-shadow(0 0 40px var(--star-gold));
        }

        /* Celestial Coordinates */
        .coords {
            position: absolute;
            top: 20px;
            color: var(--star-gold);
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 10;
            opacity: 0.6;
        }

        .planet-name {
            position: absolute;
            bottom: -30px;
            color: white;
            z-index: 1;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0;
            transition: 0.5s;
        }

        .swiper-slide-active .planet-name { opacity: 1; bottom: -10px; }
    </style>
</head>
<body>
<h1 style=" filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.4)); position: absolute; letter-spacing: 50%; top: 5%;">SLIDER</h1>
<div class="ui-wrapper">
    <div class="side-menu" id="sideMenu"></div>

    <div class="slider-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="mainWrapper"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const bodies = [
        { name: "SOLAR SYSTEM",  img: "./images/image_1.jpg", coord: "SEC-04.A" },
        { name: "COSMOS", img: "./images/image_2.jpg", coord: "SEC-05.B" },
        { name: "MOON", img: "./images/image_3.jpg", coord: "SEC-06.C" },
        { name: "HELIX NEBULA",  img: "./images/image_4.jpg", coord: "SEC-04.A" },
        { name: "COSMOS", img: "./images/image_5.jpg", coord: "SEC-05.B" },
        { name: "ORION", img: "./images/image_6.jpg", coord: "SEC-06.C" },
        { name: "EARTH", img: "./images/image.jpg", coord: "SEC-08.D" }
    ];

    const sideMenu = document.getElementById('sideMenu');
    const mainWrapper = document.getElementById('mainWrapper');

    bodies.forEach((body, index) => {
        // Build Side Menu
        const side = document.createElement('div');
        side.className = 'side-item';
        side.onclick = () => swiper.slideTo(index);
        side.innerHTML = `<img src="${body.img}">`;
        sideMenu.appendChild(side);

        // Build Main Slider
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `
            <div class="card-wrapper">
                <div class="coords">${body.coord}</div>
                <div class="portal"></div>
                <div class="card-main"></div>
                <img src="${body.img}" class="char-img">
                <div class="planet-name">${body.name}</div>
            </div>
        `;
        mainWrapper.appendChild(slide);
    });

    const sideItems = document.querySelectorAll('.side-item');
    const updateSide = (index) => {
        sideItems.forEach((item, i) => {
            item.classList.remove('active', 'visible');
            if (i === index) item.classList.add('active', 'visible');
            else if (i === index - 1 || i === index + 1) item.classList.add('visible');
        });
    };

    const swiper = new Swiper(".mySwiper", {
        effect: "coverflow",
        centeredSlides: true,
        slidesPerView: "auto",
        coverflowEffect: { rotate: 0, stretch: 50, depth: 300, modifier: 1, slideShadows: false },
        on: {
            init: function() { updateSide(this.activeIndex); },
            slideChange: function() { updateSide(this.activeIndex); }
        }
    });
</script>
</body>
</html>
