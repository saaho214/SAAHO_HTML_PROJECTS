<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Bio-Hex UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --champagne: #f7e7ce;
            --gold-glow: #d4af37;
            --velvet: #0a0a0a;
            /* The Bio-Hex Clip: A tall hexagon with "bitten" notches */
            --hex-clip: polygon(50% 0%, 100% 20%, 100% 45%, 90% 50%, 100% 55%, 100% 80%, 50% 100%, 0% 80%, 0% 55%, 10% 50%, 0% 45%, 0% 20%);
        }

        body {
            background-color: #050505;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Playfair Display', serif; /* Elegant serif font */
        }

        .ui-wrapper {
            display: flex;
            align-items: center;
            width: 90%;
            gap: 40px;
        }

        /* --- SIDE MENU: FILM REEL FRAMES --- */
        .side-menu { display: flex; flex-direction: column; gap: 15px; width: 80px; z-index: 9; }

        .side-item {
            width: 55px; height: 75px;
            background: rgba(212, 175, 55, 0.15);
            clip-path: var(--hex-clip);
            cursor: pointer;
            display: none;
            align-items: center; justify-content: center;
            transition: 0.4s ease-out;
        }

        .side-item.visible { display: flex; opacity: 0.3; transform: scale(0.8); }
        .side-item.active { 
            display: flex; opacity: 1; transform: scale(1.1); 
            background: var(--gold-glow);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .side-item img { width: 50%; filter: grayscale(1) contrast(1.2); }

        /* --- MAIN SLIDER --- */
        .slider-container { flex-grow: 1; }
        .swiper { padding: 100px 0; overflow: visible !important; margin-left:-500px; }
        .swiper-slide { width: 320px; height: 440px; transition: 0.6s; filter: opacity(0.2) blur(5px); }
        .swiper-slide-active { filter: opacity(1) blur(0); }

        .card-wrapper {
            position: relative;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        /* The Hexagonal Backdrop */
        .card-main {
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, #1a1a1a 0%, var(--velvet) 100%);
            clip-path: var(--hex-clip);
            z-index: 1;
            border: 5px solid rgba(212, 175, 55, 0.3);
        }

        /* The Circular Spotlight Portal */
        .portal {
            position: absolute;
            width: 240px; height: 240px;
            background: radial-gradient(circle, rgba(247, 231, 206, 0.2) 0%, transparent 70%);
            border: 1px solid var(--champagne);
            border-radius: 50%;
            z-index: 2;
            box-shadow: inset 0 0 50px rgba(212, 175, 55, 0.5), 0 0 30px rgba(212, 175, 55, 0.3);
            animation: spotlight 5s infinite alternate ease-in-out;
        }

        @keyframes spotlight {
            0% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 10px var(--gold-glow); }
            100% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 40px var(--gold-glow); }
        }

        /* Character Pop-out */
        .char-img {
            position: absolute;
            bottom: 100px; left: 50%;
            transform: translateX(-50%);
                width: 65%;
    border-radius: 50%;
            z-index: 5;
            transition: 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            filter: drop-shadow(0 20px 30px black);
        }

        .swiper-slide-active:hover .char-img {
            transform: translateX(-50%) translateY(-25px) scale(1.08);
        }

        /* Movie Title Label */
        .movie-title {
            position: absolute;
            bottom: -40px;
            color: var(--champagne);
            text-transform: uppercase;
            letter-spacing: 8px;
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.5s;
        }

        .swiper-slide-active .movie-title { opacity: 1; bottom: -20px; }

        /* Dusty Lens Effect */
        .card-main::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.1;
            z-index: 3;
        }
    </style>
</head>
<body>
<h1 style="position: absolute; letter-spacing: 50%; text-align: justify; border: 5px solid rgba(212, 175, 55, 0.3); top: 40px; color: #c89600d7;">SLIDERS</h1>
<div class="ui-wrapper">
    <div class="side-menu" id="sideMenu"></div>

    <div class="slider-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="mainWrapper"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const movies = [
        { name: "MASTER", img: "./images/images (1).jpg" },
        { name: "DARBAR", img: "./images/images (2).jpg" },
        { name: "FAUZI", img: "./images/images (5).jpg" },
        { name: "PS-II", img: "./images/images (4).jpg" },
        { name: "DEVARA", img: "./images/images (6).jpg" },
        { name: "KANTARA", img: "./images/images (7).jpg" },
        { name: "KARUPPA", img: "./images/images (8).jpg" },
        { name: "SAAHO", img: "./images/images (9).jpg" }
    ];

    const sideMenu = document.getElementById('sideMenu');
    const mainWrapper = document.getElementById('mainWrapper');

    movies.forEach((movie, index) => {
        const side = document.createElement('div');
        side.className = 'side-item';
        side.onclick = () => swiper.slideTo(index);
        side.innerHTML = `<img src="${movie.img}">`;
        sideMenu.appendChild(side);

        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `
            <div class="card-wrapper">
                <div class="portal"></div>
                <div class="card-main"></div>
                <img src="${movie.img}" class="char-img">
                <div class="movie-title">${movie.name}</div>
            </div>
        `;
        mainWrapper.appendChild(slide);
    });

    const sideItems = document.querySelectorAll('.side-item');
    const updateSide = (index) => {
        sideItems.forEach((item, i) => {
            item.classList.remove('active', 'visible');
            if (i === index) item.classList.add('active', 'visible');
            else if (i === index - 1 || i === index + 1) item.classList.add('visible');
        });
    };

    const swiper = new Swiper(".mySwiper", {
        effect: "coverflow",
        centeredSlides: true,
        slidesPerView: "auto",
        speed: 800,
        coverflowEffect: { rotate: 0, stretch: 20, depth: 500, modifier: 1, slideShadows: false },
        on: {
            init: function() { updateSide(this.activeIndex); },
            slideChange: function() { updateSide(this.activeIndex); }
        }
    });
</script>
</body>
</html>
