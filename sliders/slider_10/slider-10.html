<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyssal Shard Interface</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --neon-purple: #bc13fe;
            --deep-sea: #020b1a;
            --shard-grad: linear-gradient(135deg, #120422 0%, #020b1a 100%);
            /* The Z-Split Clip: Creates two separate-looking panels with a diagonal gap */
            --z-shard: polygon(20% 0%, 100% 0%, 100% 20%, 40% 20%, 60% 80%, 0% 80%, 0% 100%, 80% 100%, 80% 80%, 20% 80%, 40% 20%, 0% 20%, 0% 0%);
        }

        body {
            background-color: #1f0e31;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        .ui-wrapper {
            display: flex;
            align-items: center;
            width: 90%;
            gap: 40px;
        }

        /* --- SIDE MENU: CRYSTAL SHARDS --- */
        .side-menu { display: flex; flex-direction: column; gap: 20px; width: 80px; z-index: 9;}

        .side-item {
            width: 60px; height: 60px;
            background: rgba(188, 19, 254, 0.1);
            clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
            cursor: pointer;
            display: none;
            align-items: center; justify-content: center;
            transition: 0.4s ease;
        }

        .side-item.visible { display: flex; opacity: 0.4; transform: scale(0.8); }
        .side-item.active { 
            display: flex; opacity: 1; transform: scale(1.1); 
            background: var(--neon-purple);
            box-shadow: 0 0 20px var(--neon-purple);
        }

        .side-item img { width: 60%; filter: brightness(-1) invert(1); }

        /* --- MAIN SLIDER --- */
        .slider-container { flex-grow: 1; }
        .swiper { padding: 100px 0; overflow: visible !important; margin-left: -800px;}
        .swiper-slide { width: 300px; height: 400px; transition: 0.5s; filter: brightness(0.2) blur(2px); }
        .swiper-slide-active { filter: brightness(1) blur(0); }

        .card-wrapper {
            position: relative;
            width: 100%; height: 100%;
            display: flex; align-items: flex-end;
        }

        /* The Z-Shard Background */
        .card-bg {
            position: absolute;
            width: 100%; height: 85%;
            background: var(--shard-grad);
            clip-path: var(--z-shard);
            z-index: -3;
            border: 5px solid rgba(188, 19, 254, 0.2);
        }

        /* The Energy Leak (Moving through the center gap) */
        .leak-container {
            position: absolute;
            top: 20%; left: 0;
            width: 100%; height: 60%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .swiper-slide-active .leak-line {
            position: absolute;
            width: 200%; height: 4px;
            background: var(--neon-purple);
            box-shadow: 0 0 20px 2px var(--neon-purple);
            top: 50%; left: -150%;
            transform: rotate(-35deg); /* Aligned with the Z-gap */
            animation: leakFlow 3s infinite ease-in-out;
        }

        @keyframes leakFlow {
            0% { left: -150%; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 150%; opacity: 0; }
        }

        /* Character */
        .char-img {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 60%;
            border: 5px solid rgba(188, 19, 254, 0.2);
            z-index: -3;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(10px 10px 20px black);
        }

        .swiper-slide-active:hover .char-img {
            transform: translateX(-50%) translateY(-20px) scale(1.05);
        }

        /* Glass Reflection Effect */
        .card-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.05) 50%, transparent 60%);
            z-index: 2;
        }
    </style>
</head>
<body>
<h1 style="border: 1px solid rgba(188, 19, 254, 0.2); position: absolute; color: #bc13fe; TOP: 40px; letter-spacing: 50%;">3D SLIDER</h1>
<div class="ui-wrapper">
    <div class="side-menu" id="sideMenu"></div>

    <div class="slider-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="mainWrapper"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const data = [
        { name: "A_1", img: "./images/images.jpg" },
        { name: "A_2", img: "./images/images (1).jpg" },
        { name: "A_3", img: "./images/images (2).jpg" },
        { name: "A_4", img: "./images/images (3).jpg" },
        { name: "A_5", img: "./images/images (4).jpg" },
        { name: "A_6", img: "./images/images (5).jpg" },
        { name: "A_7", img: "./images/images (6).jpg" },
        { name: "A_8", img: "./images/images (7).jpg" },
        { name: "A_9", img: "./images/images (8).jpg" }
    ];

    const sideMenu = document.getElementById('sideMenu');
    const mainWrapper = document.getElementById('mainWrapper');

    data.forEach((item, index) => {
        const side = document.createElement('div');
        side.className = 'side-item';
        side.onclick = () => swiper.slideTo(index);
        side.innerHTML = `<img src="${item.img}">`;
        sideMenu.appendChild(side);

        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `
            <div class="card-wrapper">
                <div class="leak-container"><div class="leak-line"></div></div>
                <div class="card-bg"></div>
                <img src="${item.img}" class="char-img">
            </div>
        `;
        mainWrapper.appendChild(slide);
    });

    const sideElements = document.querySelectorAll('.side-item');
    const updateMenu = (index) => {
        sideElements.forEach((el, i) => {
            el.classList.remove('active', 'visible');
            if (i === index) el.classList.add('active', 'visible');
            else if (i === index - 1 || i === index + 1) el.classList.add('visible');
        });
    };

    const swiper = new Swiper(".mySwiper", {
        effect: "coverflow",
        centeredSlides: true,
        slidesPerView: "auto",
        coverflowEffect: { rotate: 0, stretch: 40, depth: 200, modifier: 2, slideShadows: false },
        on: {
            init: function() { updateMenu(this.activeIndex); },
            slideChange: function() { updateMenu(this.activeIndex); }
        }
    });
</script>
</body>
</html>
