<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Selector</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<style>
:root{
    --cyan:#4dff00;
    --dark-bg:#0a0f2f;
    --card-grad:linear-gradient(180deg,#2a1b52 0%,#0f0a1f 100%);
    --clip-shape:polygon(15% 0%,85% 0%,100% 15%,100% 85%,85% 100%,15% 100%,0% 85%,0% 15%);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--dark-bg);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.ui-wrapper{
    width:90%;
    display:flex;
    align-items:center;
    gap:60px;
}

/* ---------------- SIDE MENU ---------------- */

.side-menu{
    height:250px;
    width:80px;
    z-index: 9;
    position:relative;
}

.side-menu-inner{
    display:flex;
    flex-direction:column;
    gap:20px;
    transition:.35s ease;
}

.side-item{
    width:70px;
    height:70px;
    cursor:pointer;
    position:relative;
}

.side-item-inner{
    width:100%;
    height:100%;
    background:#15162c;
    clip-path:var(--clip-shape);

    display:flex;
    justify-content:center;
    align-items:center;
}

.side-item img{
    width:60%;
    height:60%;
    object-fit:contain;
    filter:grayscale(1) opacity(.35);
    transition:.3s;
}

.side-item.active img{
    filter:none;
}

.side-item.active::before{
    content:"";
    position:absolute;
    inset:-5px;
    border:2px solid var(--cyan);
    clip-path:var(--clip-shape);
    box-shadow:0 0 12px var(--cyan);
}

/* ---------------- SWIPER ---------------- */

.slider-container{
    flex:1;
}

.mySwiper{
    width:100%;
    padding:80px 0;
    margin-left: -200px;
}

.swiper-slide{
    width:280px;
    height:380px;
    filter:brightness(.35);
    transition:.35s;
}

.swiper-slide-active{
    filter:brightness(1);
}

.card-wrapper{
    width:100%;
    height:100%;
    position:relative;
}

.card-bg{
    position:absolute;
    bottom:0;
    width:100%;
    height:85%;
    background:var(--card-grad);
    clip-path:var(--clip-shape);
}

.swiper-slide-active .card-wrapper::after{
    content:"";
    position:absolute;
    left:-8px;
    right:-8px;
    bottom:-8px;
    height:90%;
    border:2px solid var(--cyan);
    clip-path:var(--clip-shape);
    box-shadow:0 0 15px var(--cyan);
}

.char-img{
    position:absolute;
    left:50%;
    bottom:1px;
    transform:translateX(-50%);
    width: 65%;
    height: 80%;
    clip-path:var(--clip-shape);
    object-fit:contain;
    transition:.35s;
}

.swiper-slide-active:hover .char-img{
    transform:translateX(-50%) translateY(-12px);
}

.swiper-pagination-bullet-active{
    background:var(--cyan)!important;
}
</style>
</head>

<body>
<h1 style=" text-shadow:0 0 12px var(--cyan); color:var(--cyan); position: absolute; top: 20%;">SLIDER</h1>
<div class="ui-wrapper">

    <div class="side-menu">
        <div class="side-menu-inner" id="sideMenu"></div>
    </div>

    <div class="slider-container" style="position: fixed;">

        <div class="swiper mySwiper">

            <div class="swiper-wrapper" id="swiperWrapper"></div>

            <div class="swiper-pagination"></div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>

const images=[
    "./images/images.jpg",
    "./images/images (1).jpg",
    "./images/images (2).jpg",
    "./images/images (3).jpg",
    "./images/images (4).jpg",
    "./images/images (5).jpg",
    "./images/images (6).jpg",
    "./images/images (7).jpg"
];

const sideMenu=document.getElementById("sideMenu");
const swiperWrapper=document.getElementById("swiperWrapper");

// Build UI
images.forEach((img,index)=>{

    sideMenu.insertAdjacentHTML("beforeend",`
        <div class="side-item ${index===0?"active":""}" onclick="goToSlide(${index})">
            <div class="side-item-inner">
                <img src="${img}">
            </div>
        </div>
    `);

    swiperWrapper.insertAdjacentHTML("beforeend",`
        <div class="swiper-slide">
            <div class="card-wrapper">
                <div class="card-bg"></div>
                <img class="char-img" src="${img}">
            </div>
        </div>
    `);

});

const sideItems=document.querySelectorAll(".side-item");

const swiper=new Swiper(".mySwiper",{

    effect:"coverflow",

    centeredSlides:true,

    slidesPerView:"auto",

    coverflowEffect:{
        rotate:0,
        stretch:100,
        depth:250,
        modifier:1,
        slideShadows:false
    },

    pagination:{
        el:".swiper-pagination",
        clickable:true
    },

    on:{
        slideChange(){
            updateSideMenu(this.activeIndex);
        }
    }

});

const ITEM_HEIGHT=90;
const VISIBLE=3;

function updateSideMenu(index){

    sideItems.forEach((item,i)=>{
        item.classList.toggle("active",i===index);
    });

    let start=index-1;

    if(start<0)
        start=0;

    const maxStart=Math.max(0,sideItems.length-VISIBLE);

    if(start>maxStart)
        start=maxStart;

    sideMenu.style.transform=`translateY(-${start*ITEM_HEIGHT}px)`;

}

function goToSlide(index){
    swiper.slideTo(index);
    updateSideMenu(index);
}

updateSideMenu(0);

</script>

</body>
</html>
