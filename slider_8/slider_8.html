<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sci-Fi Card Selector</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
<link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="ui-wrapper">
      <div class="side-menu">
        <div class="side-item active" onclick="goToSlide(0)">
          <div class="side-item-inner"><img src="./images/images.jpg" /></div>
        </div>
        <div class="side-item" onclick="goToSlide(1)">
          <div class="side-item-inner">
            <img src="./images/images (1).jpg" />
          </div>
        </div>
        <div class="side-item" onclick="goToSlide(2)">
          <div class="side-item-inner">
            <img src="./images/images (2).jpg" />
          </div>
        </div>
        <div class="side-item" onclick="goToSlide(3)">
          <div class="side-item-inner">
            <img src="./images/images (3).jpg" />
          </div>
        </div>
        <div class="side-item" onclick="goToSlide(4)">
          <div class="side-item-inner">
            <img src="./images/images (4).jpg" />
          </div>
        </div>
        <div class="side-item" onclick="goToSlide(5)">
          <div class="side-item-inner">
            <img src="./images/images (5).jpg" />
          </div>
        </div>
      </div>

      <div class="slider-container">
        <div class="swiper mySwiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <div class="card-wrapper">
                <div class="card-bg"></div>
                <img src="./images/images.jpg" class="char-img" />
              </div>
            </div>
            <div class="swiper-slide">
              <div class="card-wrapper">
                <div class="card-bg"></div>
                <img src="./images/images (1).jpg" class="char-img" />
              </div>
            </div>
            <div class="swiper-slide">
              <div class="card-wrapper">
                <div class="card-bg"></div>
                <img src="./images/images (2).jpg" class="char-img" />
              </div>
            </div>
            <div class="swiper-slide">
              <div class="card-wrapper">
                <div class="card-bg"></div>
                <img src="./images/images (3).jpg" class="char-img" />
              </div>
            </div>
            <div class="swiper-slide">
              <div class="card-wrapper">
                <div class="card-bg"></div>
                <img src="./images/images (4).jpg" class="char-img" />
              </div>
            </div>
            <div class="swiper-slide">
              <div class="card-wrapper">
                <div class="card-bg"></div>
                <img src="./images/images (5).jpg" class="char-img" />
              </div>
            </div>
          </div>
          <div class="swiper-pagination"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="script.js"></script>
  </body>
</html>
